{
    "profiles": [
        {
            "name": "RAVAGE BSP2",
            "tasks": [
                {
                    "enabled": true,
                    "stripTbProperties": false,
                    "target": "${MAP_BASE_NAME}-compile.map",
                    "type": "export"
                },
                {
                    "enabled": true,
                    "parameters": "-bsp2 -leaktest -wadpath \"${MAP_DIR_PATH}\" ${MAP_BASE_NAME}-compile.map ${MAP_BASE_NAME}.bsp",
                    "tool": "${qbsp}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "parameters": "${MAP_BASE_NAME}.bsp",
                    "tool": "${vis}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "parameters": "-bounce -extra4 ${MAP_BASE_NAME}.bsp",
                    "tool": "${light}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "source": "${MAP_BASE_NAME}.bsp",
                    "target": "${GAME_DIR_PATH}/base/maps",
                    "type": "copy"
                }
            ],
            "workdir": "${MAP_DIR_PATH}"
        }
    ],
    "version": 1
}
