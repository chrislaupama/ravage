{
    "version": 9,
    "name": "RAVAGE",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" },
        { "format": "Standard" }
    ],
    "filesystem": {
        "searchpath": "base",
        "packageformat": { "extension": ".pk3", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".C"],
        "attribute": "wad"
    },
    "entities": {
        "definitions": [ "ravage.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "setDefaultProperties": true
    },
    "tags": {
        "brush": [
            {
                "name": "Detail",
                "attribs": [],
                "match": "classname",
                "pattern": "func_detail*"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger"
            },
            {
                "name": "Func",
                "attribs": [],
                "match": "classname",
                "pattern": "func*"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "hint*"
            }
        ]
    },
    "softMapBounds": "-4096 -4096 -4096 4096 4096 4096",
    "compilationTools": [
        { "name": "qbsp", "description": "ericw-tools qbsp (deps/ericw-tools/bin/qbsp after running tools/fetch-ericw-tools.sh)" },
        { "name": "vis", "description": "ericw-tools vis" },
        { "name": "light", "description": "ericw-tools light" }
    ]
}
