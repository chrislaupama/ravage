// Default controls and startup, run before the player's own config.cfg.
// Copied into base/ by tools/build-game-data.sh.

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind space +jump
bind mouse2 +jump
bind mouse1 +attack
bind ctrl +attack
bind tab +showscores

// Weapons: 1 shotgun, 2 machinegun, 3 rocket, 4 grenade, 5 lightning, 6 railgun.
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind mwheelup "impulse 12"
bind mwheeldown "impulse 10"
bind q "impulse 12"
bind e "impulse 10"

bind t messagemode
bind ` toggleconsole

// There is no main menu yet, so a plain launch (no +map or +connect)
// starts the Duel arena.
alias f_startup "map duel_graybox"
